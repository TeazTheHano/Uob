<div id="4b7a4e96-7c1e-1c4e-af9f-aef9af1661b1">
  <input
    type="radio"
    name="popup-privilege-control"
    id="popup-privilege-open"
    style="display: none"
  />
  <input
    type="radio"
    name="popup-privilege-control"
    id="popup-privilege-close"
    style="display: none"
    checked=""
  />

  <style>
    .popup-privilege-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .popup-privilege-container input[type="datetime-local"],
    .popup-privilege-container option {
      color: #514d4d;
    }

    .popup-privilege-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--ui-bg-overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1;
    }

    body:has(#popup-privilege-open:checked) {
      overflow: hidden;
      height: 100%;
    }

    #popupPrivilege {
      position: relative;
      z-index: 2;
      border: none;
      padding: var(--ui-spacing-4xl);
      border-radius: var(--ui-spacing-xs);
      background-color: var(--ui-on-bg, #ffffff);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: var(--ui-bg);
      box-sizing: border-box;

      /* Center horizontally and add vertical margin for natural scroll */
      margin: 40px auto;
      width: 90%;
      max-width: 600px;
    }

    #popup-privilege-open:checked ~ .popup-privilege-container {
      display: block;
    }

    .popup-close {
      cursor: pointer;
      position: absolute;
      top: var(--ui-spacing-xl);
      right: var(--ui-spacing-xl);
      z-index: 10;
    }

    #popupPrivilege > img {
      height: var(--ui-spacing-5xl);
      width: auto;
      margin: 0 auto var(--ui-spacing-xl) auto;
      display: block;
    }

    #popupPrivilege form {
      width: 100%;
    }

    #popupPrivilege input,
    #popupPrivilege select,
    #popupPrivilege textarea {
      background-color: var(--ui-bg) !important;
      border-radius: var(--ui-radius-sm);
      padding: var(--ui-spacing-sm) var(--ui-spacing-md);
      outline: none;
      border: 1px solid var(--ui-on-bg, black) !important;
      color: var(--ui-on-bg, black) !important;
      font-size: var(--ui-font-size-body);
      margin-bottom: var(--ui-spacing-md);
      width: 100%;
      box-sizing: border-box;
    }

    #popupPrivilege label:has(+ input:required):after {
      content: " *";
      color: red;
    }

    #popupPrivilege form div:not([class*="ui-col2-grid"]) {
      display: flex;
      flex-direction: column;
      gap: var(--ui-spacing-xs);
    }

    @media (max-width: 767px) {
      #popupPrivilege {
        margin: 20px auto;
        padding: var(--ui-spacing-xl);
        max-width: 95vw;
      }
    }

    @media (min-width: 768px) {
      #popupPrivilege {
        max-width: 600px;
      }
    }
  </style>

  <div class="popup-privilege-container" repeat="detaildata">
    <label for="popup-privilege-close" class="popup-privilege-overlay"></label>

    <div id="popupPrivilege">
      <img
        src="https://static.izzi.asia/images/2026/6/8/2606088923_574ec0ed80f8b7edcd239ddd51a232ce69152e04.png"
        binding-imgpath="https://static.izzi.asia/images/2026/6/8/2606088923_574ec0ed80f8b7edcd239ddd51a232ce69152e04.png"
        alt="logo"
      />
      <label for="popup-privilege-close" class="popup-close">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M18 6L6 18M6 6L18 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          ></path>
        </svg>
      </label>
      <div class="ui-flex-col ui-gap-md">
        <p
          class="ui-font-label ui-text-center"
          binding-name="          Đặc quyền        "
        >
          Đặc quyền
        </p>
        <h1
          binding-name="          Trải nghiệm trà chiều cao cấp        "
          class="ui-text-center"
        >
          Trải nghiệm trà chiều cao cấp
        </h1>
        <p
          class="ui-font-label ui-text-center"
          binding-name="          Mã kích hoạt được in trên thư mời sử dụng dịch vụ hoặc liên hệ với          Hotline (028) 7305 6896 để kiểm tra thông tin        "
        >
          Mã kích hoạt được in trên thư mời sử dụng dịch vụ hoặc liên hệ với
          Hotline (028) 7305 6896 để kiểm tra thông tin
        </p>
      </div>

      <form>
        <input
          id="privilege_menu"
          name="menu"
          type="text"
          value="{{id}}"
          class="ui-d-none"
        />
        <div class="ui-col2-grid">
          <div>
            <label for="privilege_name">Họ và tên người đặt bàn</label>
            <input
              name="name"
              id="privilege_name"
              type="text"
              placeholder="Nhập họ và tên"
              required=""
            />
          </div>
          <div>
            <label for="privilege_mobile">Số điện thoại người đặt bàn</label>
            <input
              name="mobile"
              id="privilege_mobile"
              type="tel"
              placeholder="Nhập số điện thoại"
              required=""
              minlength="10"
              maxlength="15"
              inputmode="numeric"
            />
          </div>
        </div>

        <div>
          <label for="privilege_email">Email đặt bàn</label>
          <input
            name="email"
            id="privilege_email"
            type="email"
            placeholder="Nhập email liên hệ"
            required=""
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          />
        </div>

        <div class="ui-col2-grid">
          <div>
            <label for="privilege_addresses">Chọn địa điểm đặt bàn</label>
            <select name="addresses" id="privilege_addresses" required="">
              <option value="">--Chọn địa điểm--</option>
              <option repeat="addresses" value="{{id}}">
                {{name}} - {{detailAddress}}
              </option>
            </select>
          </div>
          <div>
            <label for="privilege_bookingTimeUob">Ngày giờ đặt bàn</label>
            <input
              type="datetime-local"
              id="privilege_bookingTimeUob"
              name="bookingTimeUob"
              required=""
            />
          </div>
        </div>

        <!-- <div class="ui-col2-grid">
          <div>
            <label for="privilege_cardLast6Digits" class="ui-d-none"
              >6 số cuối số điện thoại</label
            >
            <input
              class="ui-d-none"
              type="text"
              id="privilege_cardLast6Digits"
              name="cardLast6Digits"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Nhập 6 số cuối số điện thoại"
              maxlength="6"
              minlength="6"
            />
          </div> -->

          <div>
            <label for="privilege_giftcode">Mã voucher sử dụng</label>
            <input
              type="text"
              id="privilege_giftcode"
              name="giftcode"
              inputmode="numeric"
              placeholder="Nhập mã voucher của bạn để sử dụng"
              required=""
            />
          </div>
        <!-- </div> -->

        <div>
          <label for="privilege_note">Ghi chú</label>
          <textarea
            name="note"
            id="privilege_note"
            cols="30"
            rows="10"
            placeholder="Ghi chú cho buổi đặt bàn"
          ></textarea>
        </div>
        <button
          for="popup-privilege-close"
          class="ui-button-primary ui-button-medium ui-w-full ui-center"
          style="cursor: pointer"
        >
          Đặt dịch vụ
        </button>
      </form>
    </div>
  </div>
</div>
