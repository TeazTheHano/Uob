            width: 100vw;
            height: 100vh;
            z-index: 9999;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .popup-confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1;
        }

        body:has(#popup-confirm-open:checked) {
            overflow: hidden;
            height: 100%;
        }

        #popupConfirm {
            position: relative;
            z-index: 2;
            border: none;
            padding: var(--ui-spacing-4xl);

            margin: 40px auto;
            width: 90%;
            max-width: 450px;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--ui-spacing-xl);
        }

        #popup-confirm-open:checked~.popup-confirm-container {
            display: block;
        }

        #popupConfirm>img {
            height: var(--ui-spacing-5xl);
            width: auto;
        }

        @media (max-width: 767px) {
            #popupConfirm {
                margin: 20px auto;
                padding: var(--ui-spacing-xl);
                max-width: 95vw;
            }
        }
