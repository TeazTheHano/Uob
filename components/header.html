<div>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    /* ==========================================================================
      IDENTIFICATION
    ========================================================================== */
    #menu-toggle {
      grid-area: inputGr;
    }

    #section-header-top-bar {
      grid-area: topBarGr;
      display: none;
    }

    #section-header-logo {
      grid-area: logoGr;
    }

    #hamburger-menu {
      grid-area: menuGr;
    }

    #hamburger-menu-icon {
      grid-area: menuIconGr;
      margin-right: var(--ui-spacing-sm);
      padding: var(--ui-spacing-sm);
    }

    #header-slider {
      grid-area: headerSliderGr;
    }

    /* ==========================================================================
      END of IDENTIFICATION
    ========================================================================== */
    .w100 {
      width: 100%;
    }


    header a {
      text-decoration: none;
      color: inherit;

    }

    #logo {
      display: block;
      width: auto;
      position: sticky;
      top: 0;
      padding: var(--ui-spacing-xs) var(--ui-spacing-sm);
      margin-left: var(--ui-spacing-sm);
    }

    #logo>img {
      height: var(--ui-spacing-lg);
    }

    #section-header {
      color: var(--ui-bg);
      /* padding: var(--ui-spacing-sm) var(--ui-spacing-xl); */
      transition: background-color var(--ui-transition);
      /* Smooth transition when toggled */
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-areas:
        'logoGr inputGr menuIconGr'
        'menuGr menuGr menuGr'
        'topBarGr topBarGr topBarGr';
      overflow: visible;
      position: fixed;
      top: 0;
      width: 100%;
      align-items: center;
    }

    /* Change header background color when hamburger menu is active (Option 2 - iOS 13 Safe) */
    #menu-toggle:checked~#section-header {
      background-color: var(--ui-bg-overlay, #000);
    }

    #menu-toggle:checked~#section-header #logo {
      z-index: 10000;
    }

    #section-header-top-bar>span {
      font-weight: 200;
    }

    #hamburger-menu {
      position: sticky;
      top: 0;
      display: none;
    }

    #section-header .hamburger-close {
      display: none;
    }

    #section-header .ui-button-medium,
    #section-header summary {
      justify-content: flex-start;
    }

    #login {
      border: 1px solid currentColor;
      border-radius: var(--ui-spacing-2xs);
      padding: var(--ui-spacing-xs) var(--ui-spacing-lg);
      justify-content: center;
      text-align: center;
      align-items: center;
      gap: var(--ui-spacing-sm);
      font-weight: 600;
      font-size: var(--ui-font-size-label);
      line-height: var(--ui-line-height-label);
    }

    #section-header:has(#menu-toggle:checked) {
      background-color: var(--ui-bg-overlay);
      backdrop-filter: blur(var(--ui-spacing-sm));
      box-shadow: 0 2px 10px var(--ui-bg-overlay), 0 0 0 100vmax var(--ui-bg-overlay);
      height: fit-content;
      grid-template-rows: fit-content(20%) 1fr fit-content(0);
      overflow-y: scroll;
    }

    /* Anti scroll background page when menu is open */
    body:has(#menu-toggle:checked) {
      overflow: hidden;
    }

    #section-header #menu-toggle:checked~#hamburger-menu-icon .hamburger-open {
      display: none !important;
    }

    #section-header #menu-toggle:checked~#hamburger-menu-icon .hamburger-close {
      display: block !important;
    }

    #section-header #menu-toggle:checked~#hamburger-menu,
    #section-header #menu-toggle:checked~#section-header-top-bar {
      display: flex !important;
      flex-direction: column;
      align-items: flex-start;
      margin: 0 var(--ui-spacing-xs);
    }

    #section-header #menu-toggle:checked~#section-header-top-bar div {
      flex-direction: column;
    }

    #section-header #menu-toggle:checked~#section-header-top-bar span {
      display: none !important;
    }

    #section-header #menu-toggle:checked~#hamburger-menu *,
    #section-header #menu-toggle:checked~#section-header-top-bar * {
      text-align: left;
    }

    #section-header #menu-toggle:checked~#hamburger-menu details.ui-dropdown a,
    #section-header #menu-toggle:checked~#section-header-top-bar details.ui-dropdown a {
      padding-left: var(--ui-spacing-lg);
    }

    #section-header #menu-toggle:checked~#hamburger-menu .ui-dropdown-menu,
    #section-header #menu-toggle:checked~#section-header-top-bar .ui-dropdown-menu {
      position: static;
      background-color: unset;
      border: unset;
      min-width: unset;
      max-width: unset;
      width: 100%;
      box-shadow: unset;
    }

    #section-header #menu-toggle:checked~#hamburger-menu details.ui-dropdown[open] .ui-dropdown-menu::before,
    #section-header #menu-toggle:checked~#section-header-top-bar details.ui-dropdown[open] .ui-dropdown-menu::before {
      content: "";
      position: absolute;
      top: 0;
      width: calc(100% - var(--ui-spacing-md) * 2);
      height: 1px;
      background-color: var(--ui-primary);
      margin: 0 var(--ui-spacing-sm);
    }

    /* ==========================================================================
      DESKTOP
    ========================================================================== */

    @media (min-width: 769px) {
      .w100 {
        width: unset;
      }

      #section-header {
        --side-padding: max(0px, calc((100vw - var(--breakpoint-xl)) / 2));
        grid-template-areas:
          'topBarGr topBarGr topBarGr topBarGr'
          '. logoGr menuGr .'
          '. inputGr menuIconGr .'
          'headerSliderGr headerSliderGr headerSliderGr headerSliderGr';
        background-color: unset;
      }

      #logo {
        position: sticky;
        top: 0;
        height: var(--ui-spacing-3xl);
        width: auto;
        z-index: 999;
        margin-left: var(--side-padding);
      }

      #hamburger-menu {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 999;
        width: auto;
        height: auto;
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
        gap: var(--ui-spacing-md);
        opacity: 1;
        pointer-events: all;
        background-color: inherit;
        backdrop-filter: none;
        color: inherit;
        text-decoration: none;
        /* text-align: center; */
        margin-right: var(--side-padding);
      }

      #hamburger-menu-icon {
        display: none;
      }

      #section-header-top-bar .ui-dropdown-menu {
        color: var(--ui-bg);
        background-color: var(--ui-bg-overlay);
        border: none;
        backdrop-filter: blur(var(--ui-spacing-sm));
      }

      #hamburger-menu .ui-dropdown-menu {
        color: var(--ui-text);
        background-color: transparent;
        border: none;
        backdrop-filter: blur(var(--ui-spacing-sm));
      }

      /* ==========================================================================
      SECTOR TOP BAR
      ========================================================================== */
      #section-header-top-bar {
        background-color: var(--ui-bg-overlay, #000);
        color: var(--ui-bg);
        margin-bottom: var(--ui-spacing-xl);
        padding: 0 var(--side-padding);
        display: flex;
        max-height: 200px;
        opacity: 1;
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.3s ease, margin-bottom 0.3s ease, padding 0.3s ease;
      }

      header.hide-top-bar #section-header-top-bar {
        max-height: 0;
        opacity: 0;
        margin-bottom: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        pointer-events: none;
      }

      #section-header-top-bar p,
      #section-header-top-bar span,
      #section-header-top-bar button {
        color: inherit;
      }

      #section-header-top-bar>div:last-child>button {
        padding: var(--ui-spacing-xs) var(--ui-spacing-md);
      }

      #login {
        border: unset;
        border-radius: unset;
        padding: unset;
        justify-content: unset;
        text-align: unset;
        align-items: unset;
        gap: unset;
        font-weight: unset;
        font-size: unset;
        line-height: unset;
      }
    }
  </style>

  <section id="section-header" class="">
    <!-- 1. Checkbox ẩn để quản lý trạng thái Đóng/Mở -->
    <input type="checkbox" id="menu-toggle" checked class="ui-menu-toggle ui-d-none" />
    <!-- top bar -->

    <div id="section-header-top-bar" class="ui-row-h-between ui-gap-md">
      <div class="ui-row-v-center ui-gap-sm w100">
        <details class="ui-dropdown w100">

          </summary>

          <!-- Menu tự hiển thị khi người dùng click vào summary -->
          <div class="ui-dropdown-menu">
            <a href="">abc</a>
            <a href="">cde</a>
            <a href="">fgh</a>
          </div>
        </details>
        <span>|</span>
        <details class="ui-dropdown w100">
          <summary class="ui-button-link ui-button-small w100">
            <img src="assets\angle-small-down-W.svg" class="uob-button-special-img" alt="">
            <p class="ui-font-label">Khách hàng ưu tiên</p>
          </summary>

          <div class="ui-dropdown-menu">
            <a href="">abc</a>
            <a href="">cde</a>
            <a href="">fgh</a>
          </div>
        </details>
        <span>|</span>
        <details class="ui-dropdown w100">
          <summary class="ui-button-link ui-button-small w100">
            <img src="assets\angle-small-down-W.svg" class="uob-button-special-img" alt="">
            <p class="ui-font-label">Vietnam</p>
          </summary>

          <div class="ui-dropdown-menu">
            <a href="">abc</a>
            <a href="">cde</a>
            <a href="">fgh</a>
          </div>
        </details>

      </div>

      <div class="ui-row-v-center ui-gap-sm w100">
        <button class="ui-button-link ui-button-medium w100" color>Liên hệ</button>
        <span>|</span>
        <button class="ui-button-link ui-button-medium w100" id="login" style="justify-content: center;">Đăng
          nhập</button>
      </div>
    </div>

    <!-- header -->
    <a href="" id="logo"><img src="assets\Logo-L.svg" alt="logo"></a>

    <label for="menu-toggle" id="hamburger-menu-icon" class="ui-hamburger-trigger ui-button-icon">
      <!-- Icon mở (Hiển thị khi CHƯA check) -->
      <span class="hamburger-open ui-icon-open" style="color: var(--ui-bg);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.625H21V12.375H3V11.625ZM3 6V6.75H21V6H3ZM3 18H21V17.25H3V18Z" fill="currentColor" />
        </svg>
      </span>
      <!-- Icon đóng (Hiển thị khi ĐÃ check) -->
      <span class="hamburger-close ui-icon-close">
        <img src="assets\cross-small (3) 1.svg" alt="">
      </span>
    </label>
    <!-- menu -->

    <nav id="hamburger-menu" class="ui-hamburger-menu">
      <details class="ui-dropdown w100">
        <summary class="ui-button-link w100 ui-button-medium">
          <img src="assets\angle-small-down-W.svg" class="uob-button-special-img" alt="">
          <p class="ui-font-label  ">UOB Privilege</p>
        </summary>

        <!-- Menu tự hiển thị khi người dùng click vào summary -->
        <div class="ui-dropdown-menu">
          <a class="ui-dropdown-item ui-row-h-between ui-gap-sm" href="">
            <p binding-name="Trải nghiệm trà chiều cao cấp">Trải nghiệm trà chiều cao
              cấp</p><span class="material-symbols-outlined">
              chevron_right
            </span>
          </a>
          <a class="ui-dropdown-item ui-row-h-between ui-gap-sm " href="">
            <p binding-name="Dịch vụ trợ lý đón tiễn quốc tế">Dịch vụ trợ lý đón tiễn
              quốc tế</p><span class="material-symbols-outlined">
              chevron_right
            </span>
          </a>
        </div>
      </details>
      <a class="ui-button-link w100 ui-button-medium" href="#about">UOB Dining</a>
      <a class="ui-button-link w100 ui-button-medium" href="#services">Chi nhánh</a>
      <a class="ui-button-link w100 ui-button-medium" href="#contact">Liên hệ</a>
    </nav>

    <div id="header-slider">
      <hr>
    </div>
  </section>

</div>
