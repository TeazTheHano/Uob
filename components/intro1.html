<div>

    }

    }

    #section-intro1 * {
      font-family: var(--ui-font-family-display);
    }

    #section-intro1-content {
      padding: var(--ui-spacing-11xl) var(--ui-spacing-xl);
      gap: var(--ui-spacing-6xl);
    }

    #section-intro1-content .left {

    }

      aspect-ratio: 1;
      height: auto;
    }

    #section-intro1-content .right img {

      height: 100%;

      #section-intro1-content .left {

      }

      #section-intro1-content .right {

          >
            Nơi những trải nghiệm đẳng cấp, dịch vụ tận tâm và đặc quyền dành
