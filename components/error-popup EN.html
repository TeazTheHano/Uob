<div>
  <input
    type="radio"
    name="popup-error-control"
    id="popup-error-open"
    style="display: none"
  />
  <input
    type="radio"
    name="popup-error-control"
    id="popup-error-close"
    style="display: none"
    checked

  <style>
    .popup-error-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .popup-error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1;
    }

    body:has(#popup-error-open:checked) {
      overflow: hidden;
      height: 100%;
    }

    #popuperror {
      position: relative;
      z-index: 2;
      border: none;
      padding: var(--ui-spacing-4xl);
      border-radius: var(--ui-spacing-xs);
      background-color: var(--ui-bg, #ffffff);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: var(--ui-text);
      box-sizing: border-box;

      /* Center horizontally and add vertical margin for natural scroll */
      margin: 40px auto;
      width: 90%;
      max-width: 450px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--ui-spacing-xl);
    }

    #popup-error-open:checked ~ .popup-error-container {
      display: block;
    }

    #popuperror > img {
      height: var(--ui-spacing-5xl);
      width: auto;
    }

    @media (max-width: 767px) {
      #popuperror {
        margin: 20px auto;
        padding: var(--ui-spacing-xl);
        max-width: 95vw;
      }
    }
  </style>
