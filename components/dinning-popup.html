<div id="7b3caafb-67c1-4129-a2dc-2cec3d35a4cd">
  <input
    type="radio"
    name="popup-dinning-control"
    id="popup-dinning-open"
    style="display: none"
  />
  <input
    type="radio"
    name="popup-dinning-control"
    id="popup-dinning-close"
    style="display: none"
    checked=""
  />

  <style>
    .popup-dinning-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .popup-dinning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--ui-bg-overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1;
    }

    body:has(#popup-dinning-open:checked) {
      overflow: hidden;
      height: 100%;
    }

    #popupDinning {
      position: relative;
      z-index: 2;
      border: none;
      padding: var(--ui-spacing-4xl);
      border-radius: var(--ui-spacing-xs);
      background-color: var(--ui-on-bg, #ffffff);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: var(--ui-bg);
      box-sizing: border-box;

      /* Center horizontally and add vertical margin for natural scroll */
      margin: 40px auto;
      width: 90%;
      max-width: 600px;
    }

    #popup-dinning-open:checked ~ .popup-dinning-container {
      display: block;
    }

    .popup-close {
      cursor: pointer;
      position: absolute;
      top: var(--ui-spacing-xl);
      right: var(--ui-spacing-xl);
      z-index: 10;
    }

    #popupDinning > img {
      height: var(--ui-spacing-5xl);
      width: auto;
      margin: 0 auto var(--ui-spacing-xl) auto;
      display: block;
    }

    #popupDinning form {
      width: 100%;
    }

    #popupDinning input,
    #popupDinning select,
    #popupDinning textarea {
      background-color: transparent;
      border-radius: var(--ui-radius-sm);
      padding: var(--ui-spacing-sm) var(--ui-spacing-md);
      outline: none;
      border: 1px solid var(--ui-bg, #ffffff);
      color: var(--ui-bg, #ffffff);
      font-size: var(--ui-font-size-body);
      margin-bottom: var(--ui-spacing-md);
      width: 100%;
      box-sizing: border-box;
    }

    #popupDinning label:has(+ input:required):after {
      content: " *";
      color: red;
    }

    #popupDinning form div:not([class*="ui-col2-grid"]) {
      display: flex;
      flex-direction: column;
      gap: var(--ui-spacing-xs);
    }

    @media (max-width: 767px) {
      #popupDinning {
        margin: 20px auto;
        padding: var(--ui-spacing-xl);
        max-width: 95vw;
      }
    }

    @media (min-width: 768px) {
      #popupDinning {
        max-width: 600px;
      }
    }

    #popupDinning select,
    #popupDinning input[type="datetime-local"] {
      color: #514d4d;
    }

    #popupDinning
      input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: brightness(0) invert(1);
      cursor: pointer;
    }
  </style>

  <div class="popup-dinning-container" repeat="detaildata">
    <label for="popup-dinning-close" class="popup-dinning-overlay"></label>

    <div id="popupDinning">
      <img
        src="https://static.izzi.asia/images/2026/6/8/2606088923_574ec0ed80f8b7edcd239ddd51a232ce69152e04.png"
        binding-imgpath="https://static.izzi.asia/images/2026/6/8/2606088923_574ec0ed80f8b7edcd239ddd51a232ce69152e04.png"
        alt="logo"
      />
      <label for="popup-dinning-close" class="popup-close">
        <svg
          width="24"
          height="24"
          viewbox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M18 6L6 18M6 6L18 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          ></path>
        </svg>
      </label>
      <div class="ui-flex-col ui-gap-md">
        <h1 class="ui-text-center">{{name}}</h1>
        <p
          class="ui-font-label ui-text-center"
          binding-name="Mã kích hoạt được in trên thư mời sử dụng dịch vụ hoặc liên hệ với Hotline&nbsp;(028) 7305 6896&nbsp;để kiểm tra thông tin"
        >
          Mã kích hoạt được in trên thư mời sử dụng dịch vụ hoặc liên hệ với
          Hotline&nbsp;(028) 7305 6896&nbsp;để kiểm tra thông tin
        </p>
      </div>

      <form id="formGetEvoucher">
        <div class="ui-col2-grid">
          <div>
            <label for="name">Họ và tên người đặt bàn</label>
            <input
              name="name"
              id="name"
              type="text"
              placeholder="Nhập họ và tên"
              required=""
            />
          </div>
          <div>
            <label for="mobile">Số điện thoại người đặt bàn</label>
            <input
              name="mobile"
              id="mobile"
              type="tel"
              placeholder="Nhập số điện thoại"
              required=""
              minlength="10"
              maxlength="15"
              inputmode="numeric"
            />
          </div>
        </div>

        <div>
          <label for="email">Email đặt bàn</label>
          <input
            name="email"
            id="email"
            type="email"
            placeholder="Nhập email liên hệ"
            required=""
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          />
        </div>

        <div class="ui-col2-grid">
          <div>
            <label for="address">Chọn địa điểm đặt bàn</label>
            <select name="address" id="addresses" required="">
              <option value="">--Chọn địa điểm--</option>
              <option repeat="addresses" value="{{id}}">
                {{name}} - {{detailAddress}}
              </option>
            </select>
          </div>
          <div>
            <label for="date">Ngày giờ đặt bàn</label>
            <input
              type="datetime-local"
              id="bookingTimeUob"
              name="bookingTimeUob"
              required=""
            />
          </div>
        </div>

        <input id="menu" name="menu" type="text" value="{{id}}" type="hidden" />
        <div class="ui-col2-grid">
          <div>
            <label for="card_start">6 số MC hoặc 8 số VISA đầu tiên</label>
            <input
              type="text"
              id="startPin"
              name="card_start"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Nhập các số đầu của thẻ"
            />
          </div>
          <div>
            <label for="card_end">4 số cuối thẻ</label>
            <input
              type="text"
              id="lastPin"
              name="card_end"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Nhập các số đầu của thẻ"
            />
          </div>
        </div>

        <div>
          <label for="code">Mã voucher sử dụng</label>
          <input
            type="text"
            id="giftcode"
            name="code"
            inputmode="numeric"
            placeholder="Nhập mã voucher của bạn để sử dụng"
            required=""
          />
        </div>

        <div>
          <label for="note">Ghi chú</label>
          <textarea
            name="note"
            id="note"
            cols="30"
            rows="10"
            placeholder="Ghi chú cho buổi đặt bàn"
          ></textarea>
        </div>
        <button
          type="button"
          for="popup-privilege-close"
          class="ui-button-primary ui-button-medium ui-w-full ui-center"
          style="cursor: pointer"
        >
          Đặt dịch vụ
        </button>
      </form>
    </div>
  </div>
</div>
